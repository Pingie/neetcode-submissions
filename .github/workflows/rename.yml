name: Auto Rename NeetCode Solutions

on:
  push:
    paths:
      - '**submission-*.*'

jobs:
  rename-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Rename Submissions to Problem Name
        run: |
          # Tìm tất cả các file có dạng submission-X.ext
          find . -type f -name "submission-*.*" | while read -r filepath; do
            dir=$(dirname "$filepath")
            ext="${filepath##*.}"
            problem_name=$(basename "$dir")
            
            # Đổi tên file từ submission-0.py thành tên-đề-bài.py
            new_filepath="$dir/$problem_name.$ext"
            
            if [ "$filepath" != "$new_filepath" ]; then
              echo "Renaming $filepath to $new_filepath"
              mv "$filepath" "$new_filepath"
            fi
          done

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --staged --quiet || git commit -m "auto: rename solution files to problem titles"
          git push
